<svg width="900" height="92" viewBox="0 0 900 92" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1a22"/>
      <stop offset="100%" stop-color="#070b11"/>
    </linearGradient>
    
  </defs>
  <rect x="0" y="0" width="900" height="92" rx="0" fill="transparent"/>
  
  
  <rect x="1" y="1" width="898" height="90" rx="10"
        fill="url(#panelGrad)" stroke="#1d4a4a" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="90" rx="10"
        fill="none" stroke="#2ee6d6" stroke-width="0.6" opacity="0.55"/>
  <text x="450" y="36" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,Courier,monospace" font-size="13" fill="#5f8482" text-anchor="middle"><tspan fill="#3dffa0">$</tspan> exit</text>
  <text x="450" y="62" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,Courier,monospace" font-size="14" fill="#45f3ff" text-anchor="middle" filter="url(#glow)">connection closed.</text>
  
</svg>
