name: Update Profile README

on:
  schedule:
    - cron: "0 3 * * *" # once a day
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test profile generators
        run: node --test tools/*.test.js

      - name: Fetch public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/fetch-data.js

      - name: Render README and terminal artwork
        run: node tools/render.js

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if ! git diff --cached --quiet; then
            git -c core.editor=true commit -m "chore: refresh profile [skip ci]"
            git push
          fi
